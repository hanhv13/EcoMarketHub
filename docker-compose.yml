version: '3.8'

services:
  db:
    image: mysql:8
    container_name: ecomarkethub_db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: secondnest
    ports:
      - "3306:3306"
    volumes:
      # Tự động khởi tạo database và dữ liệu mẫu khi container mới được tạo
      - ./database/schema.sql:/docker-entrypoint-initdb.d/1-schema.sql
      - ./database/clean_database.sql:/docker-entrypoint-initdb.d/2-clean_database.sql
      - db_data:/var/lib/mysql

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ecomarkethub_backend
    restart: always
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - DB_HOST=db
      - DB_USER=root
      - DB_PASSWORD=rootpassword
      - DB_NAME=secondnest
      - FRONTEND_URL=http://localhost:5173
      - JWT_SECRET=supersecretjwtkey
    volumes:
      # Map thư mục code vào container để dev (hot-reload)
      - ./backend:/app
      - /app/node_modules
    depends_on:
      - db

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: ecomarkethub_frontend
    restart: always
    ports:
      - "5173:5173"
    environment:
      - VITE_API_URL=http://localhost:5000
    volumes:
      # Map thư mục code vào container để dev (hot-reload)
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - backend

volumes:
  db_data:
